name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify pinned toolchain
        shell: pwsh
        run: ./setup.ps1
      - name: Build patch and run offline tests
        shell: pwsh
        run: ./build.ps1 -RunTests
      - uses: actions/upload-artifact@v4
        with:
          name: niagara-open-meteo-mpp
          path: |
            dist/*.mpp
            dist/SHA256SUMS
          if-no-files-found: error
